[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "l4den", email = "stefan.ladinski@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langchain-unstructured[local]>=1.0.1",
    "langgraph>=1.2.15",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "streamlit>=1.67.0",
    "tavily-python>=0.8.5",
    "unstructured>=0.27.35",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
